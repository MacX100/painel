<style>
:root{--bg:#111111;--card:#181817;--line:rgba(201,162,77,.28);--gold:#C9A24D;--gold2:#E3C779;--ink:#F3EFE6;--ink2:#A8A296;--ink3:#76716A;--err:#E07A5F}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
.ag-bg{position:fixed;inset:0;background:radial-gradient(900px 600px at 50% -10%,rgba(201,162,77,.16),transparent 60%),radial-gradient(700px 500px at 100% 110%,rgba(201,162,77,.07),transparent 60%),var(--bg)}
.ag-bg:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
.ag-wrap{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 16px}
.ag-card{width:100%;max-width:400px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01)),var(--card);border:1px solid var(--line);border-radius:18px;padding:40px 32px 30px;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.04);animation:in .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.ag-brand{text-align:center}
.ag-brand img{width:78px;height:auto;display:block;margin:0 auto 18px;filter:drop-shadow(0 6px 18px rgba(201,162,77,.25))}
.ag-name{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:27px;letter-spacing:.14em;color:var(--gold2);line-height:1.1}
.ag-sub{font-size:10.5px;letter-spacing:.42em;color:var(--ink2);margin-top:8px;padding-left:.42em}
.ag-rule{display:flex;align-items:center;gap:12px;margin:26px 0 22px;color:var(--gold);font-size:10.5px;letter-spacing:.28em;text-transform:uppercase}
.ag-rule:before,.ag-rule:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.ag-rule:after{background:linear-gradient(90deg,var(--line),transparent)}
.ag-hint{font-size:13.5px;color:var(--ink2);text-align:center;margin-bottom:18px;line-height:1.5}
.ag-field{position:relative}
.ag-field label{display:block;font-size:12px;font-weight:500;color:var(--ink2);margin-bottom:7px;letter-spacing:.02em}
#staticrypt-password{width:100%;height:50px;background:#0E0E0D;border:1px solid rgba(255,255,255,.1);border-radius:11px;color:var(--ink);font:500 16px Inter,system-ui,sans-serif;letter-spacing:.06em;padding:0 48px 0 16px;outline:none;transition:border-color .2s,box-shadow .2s}
#staticrypt-password::placeholder{color:var(--ink3);letter-spacing:0}
#staticrypt-password:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,162,77,.14)}
.staticrypt-toggle-password-visibility{position:absolute;right:14px;bottom:15px;width:20px;height:20px;cursor:pointer;opacity:.55;filter:invert(1)}
.staticrypt-toggle-password-visibility:hover{opacity:.9}
.ag-err{min-height:0;font-size:12.5px;color:var(--err);margin-top:8px;opacity:0;transition:opacity .2s}
.ag-err.show{opacity:1}
.staticrypt-remember{display:flex;align-items:center;gap:10px;margin:16px 0 22px;font-size:13px;color:var(--ink2);cursor:pointer;user-select:none}
.staticrypt-remember input{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1px solid rgba(255,255,255,.22);border-radius:5px;background:#0E0E0D;display:grid;place-items:center;cursor:pointer;flex:none}
.staticrypt-remember input:checked{background:var(--gold);border-color:var(--gold)}
.staticrypt-remember input:checked:after{content:"";width:5px;height:9px;border:solid #151515;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.ag-btn{width:100%;height:50px;border:0;border-radius:11px;cursor:pointer;font:600 14px Inter,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#17140D;background:linear-gradient(180deg,#E0BE6C,#C29A43);box-shadow:0 10px 24px rgba(201,162,77,.25),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s,box-shadow .2s,filter .2s}
.ag-btn:hover{filter:brightness(1.05);box-shadow:0 14px 30px rgba(201,162,77,.32),inset 0 1px 0 rgba(255,255,255,.35)}
.ag-btn:active{transform:translateY(1px)}
.ag-lock{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:20px;font-size:11.5px;color:var(--ink3)}
.ag-lock svg{width:13px;height:13px}
.ag-foot{margin-top:26px;text-align:center;font-size:11.5px;color:var(--ink3);line-height:1.7;letter-spacing:.02em}
.ag-foot b{color:var(--ink2);font-weight:500}
.staticrypt-spinner-container{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg)}
.staticrypt-spinner{width:34px;height:34px;border:2px solid rgba(201,162,77,.25);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:420px){.ag-card{padding:34px 22px 26px;border-radius:16px}.ag-name{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
